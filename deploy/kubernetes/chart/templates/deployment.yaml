apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1 # SQLite and the Mumble server must never run as two independent replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kallisti
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kallisti
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/caddyfile: {{ .Files.Get "files/Caddyfile" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kallisti
          image: {{ .Values.images.app | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ALLOWED_ORIGINS
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: TRUST_FORWARDED_FOR
              value: "1"
            - name: DB_PATH
              value: /data/kallisti.db
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: BACKUP_DIR
              value: /data/backups
            - name: WEB_DIR
              value: /app/web
            - name: MUMBLE_CERT_FILE
              value: /data/mumble-tls/current/mumble.crt
            - name: MUMBLE_KEY_FILE
              value: /data/mumble-tls/current/mumble.key
            - name: MUMBLED_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superuserSecretName | quote }}
                  key: password
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: mumble-tcp
              containerPort: 64738
              protocol: TCP
            - name: mumble-udp
              containerPort: 64738
              protocol: UDP
          startupProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - name: app-data
              mountPath: /data
            - name: app-tmp
              mountPath: /tmp
        - name: caddy
          image: {{ .Values.images.caddy | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          env:
            - name: DOMAIN
              value: {{ .Values.host | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.caddy | nindent 12 }}
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-runtime
              mountPath: /config
            - name: caddy-tmp
              mountPath: /tmp
        - name: cert-sync
          image: {{ .Values.images.certSync | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DOMAIN
              value: {{ .Values.host | quote }}
          resources:
            {{- toYaml .Values.resources.certSync | nindent 12 }}
          volumeMounts:
            - name: caddy-data
              mountPath: /caddy-data
              readOnly: true
            - name: app-data
              mountPath: /app-data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-app
        - name: app-tmp
          emptyDir: {}
        - name: caddy-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-caddy
        - name: caddy-config
          configMap:
            name: {{ .Release.Name }}-caddy
        - name: caddy-runtime
          emptyDir: {}
        - name: caddy-tmp
          emptyDir:
            medium: Memory
